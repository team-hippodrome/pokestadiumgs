name: Public PR ROM Gate

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Public PR number to validate using its GitHub merge ref
        required: false

      ref:
        description: Same-repository branch or SHA when no PR number is supplied
        required: false
        default: master

permissions:
  contents: read
  packages: read

env:
  # Built and pushed by rebuild-baseline-image.yml. Private: it contains
  # the retail baserom.
  GS_DECOMP_AGENT_IMAGE: ghcr.io/team-hippodrome/pokestadiumgs-ci:latest

concurrency:
  group: public-pr-rom-gate-${{ github.event.pull_request.number || inputs.pr_number || inputs.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    name: Validate ROM against master
    # Required status checks can never be satisfied by a direct push to
    # master (see refresh-coverage.yml), so that job opens a PR instead.
    # Its bot has author_association NONE like any GitHub App, so trust it
    # narrowly: same-repo only, and only on the one fixed branch name that
    # workflow ever pushes to. Its content is always deterministically
    # regenerated from master's own already-trusted source, never from
    # PR-supplied input.
    # Draft PRs are skipped; marking one ready runs the gate (ready_for_review).
    # Fork PRs run too: the repository setting "Require approval for all
    # external contributors" makes a maintainer approve every fork run before
    # it starts, so the approval is the trust decision. Keep that setting on.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # GitHub-hosted: free and unlimited for public repositories, 4 vCPU /
    # 16 GB, x86-64, so the amd64 image runs natively.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pull the CI baseline image
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --quiet --platform linux/amd64 "$GS_DECOMP_AGENT_IMAGE"
          docker logout ghcr.io

      - name: Checkout the PR merge ref or selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || inputs.ref }}
          persist-credentials: false

      - name: Detect a coverage-only diff
        id: coverage-only
        # refresh-coverage.yml opens/updates a PR (ci/refresh-coverage) whose
        # entire diff contains only generated coverage/documentation reports,
        # including docs/coverage.svg, regenerated
        # deterministically from master's own already-trusted source. That
        # PR still needs a real "Validate ROM against master" status to
        # satisfy branch protection, but there is nothing in it that could
        # ever affect the ROM, so compare the PR's whole base...head diff
        # (not just this push) and skip the build whenever it is exactly
        # those report files -- for any pull_request action, not just
        # synchronize, since a freshly opened PR needs this just as much.
        # The job still runs and reports a real status either way, so a
        # required-status-check on this workflow is never left pending.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvxE 'COVERAGE\.md|docs/coverage\.svg|UNDOCUMENTED\.md'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "pr-rom-gate: PR diff touches only generated reports; skipping the full rebuild" >&2
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and compare against the retail checksum
        if: steps.coverage-only.outputs.skip != 'true'
        shell: bash
        # The container runs as root with every capability dropped, so it
        # cannot write into a runner-owned directory; make /out writable.
        run: |
          mkdir -p "$RUNNER_TEMP/pokestadiumgs-gate-out"
          chmod 0777 "$RUNNER_TEMP/pokestadiumgs-gate-out"
          bash ci/gate-pr.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pokestadiumgs-gate-out"

      - name: Upload gate and proposed coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pr-rom-gate-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
          path: ${{ runner.temp }}/pokestadiumgs-gate-out/
          if-no-files-found: warn
          retention-days: 14
