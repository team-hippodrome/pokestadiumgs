name: Rebuild CI baseline image

# ci/gate-pr.sh overlays each PR onto whatever this image already has baked
# in (see its own sync_tree comments), and only forces its expensive `make
# -B` full rebuild when split_changed (yamls/), headers_changed (include/),
# tools_changed (tools/), or makefile_changed is set -- see gate-pr.sh's own
# full_build check. A plain src/** change (the overwhelming majority of
# merges -- one landed function match at a time) is handled by sync_tree
# alone: it overlays just the differing files and runs a normal incremental
# make, regardless of how stale this baked image's own src/ tree is. So
# rebuilding the whole image after every such merge buys nothing; only the
# paths below actually change what "stale" costs the next PR gate.
#
# This runs on a GitHub-hosted ubuntu runner and pushes the image to the
# private ghcr.io/team-hippodrome/pokestadiumgs-ci package, which
# pr-rom-gate.yml and refresh-coverage.yml pull. There is no persistent
# checkout here, so ci/Dockerfile.hosted builds from scratch inside the
# image (natively on x86-64). ci/Dockerfile and ci/build-baseline.sh remain
# for building the same image locally.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "yamls/**"
      - "include/**"
      - "tools/**"
      - "ci/Dockerfile.hosted"
      - ".github/workflows/rebuild-baseline-image.yml"
      - "requirements.txt"
      - "Makefile"

concurrency:
  group: rebuild-ci-baseline-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GS_DECOMP_AGENT_IMAGE: ghcr.io/team-hippodrome/pokestadiumgs-ci:latest
  # FROM scratch image holding only /baserom.z64. Pushed once by hand; it
  # must stay private, like the CI image built from it.
  BASEROM_IMAGE: ghcr.io/team-hippodrome/pokestadiumgs-baserom:us

jobs:
  rebuild:
    name: Rebuild the baked CI image from current master
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Copy the retail baserom out of its private image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --quiet --platform linux/amd64 "$BASEROM_IMAGE"
          cid="$(docker create --platform linux/amd64 "$BASEROM_IMAGE" /none)"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker cp "$cid:/baserom.z64" baseroms/us/baserom.z64
          echo "$(cut -d' ' -f1 baseroms/us/checksum.md5)  baseroms/us/baserom.z64" | md5sum -c -

      - name: Build the baseline image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$GS_DECOMP_AGENT_IMAGE" \
            --file ci/Dockerfile.hosted \
            .
          rm -f baseroms/us/baserom.z64

      - name: Confirm the image's yamls/ now match this commit
        shell: bash
        run: |
          set -euo pipefail
          drift=$(docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE/yamls:/current-yamls:ro" \
            --entrypoint bash "$GS_DECOMP_AGENT_IMAGE" -c \
            'diff -qr /work/yamls /current-yamls 2>/dev/null | wc -l')
          if [ "$drift" -ne 0 ]; then
            echo "::error::Rebuilt image still has yaml drift against $GITHUB_SHA ($drift differing path(s)) -- the rebuild did not actually pick up this commit." >&2
            exit 1
          fi
          echo "gate-pr.sh's own sync_tree will see 0 yaml drift against $GITHUB_SHA until master moves again."

      - name: Push the image
        shell: bash
        run: docker push --quiet "$GS_DECOMP_AGENT_IMAGE"

      - name: Log out of GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io
